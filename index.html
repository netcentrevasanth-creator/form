<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f3f7fc">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Beldex Community Connect – Selvaraj Team | Registration</title>
<style>
:root{
  --bg:#f3f7fc; --panel:rgba(255,255,255,.94); --line:rgba(25,91,180,.16);
  --gold:#1269e8; --gold2:#164fa8; --muted:#66758d; --text:#10203f;
  --field:#ffffff; --good:#16834b;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(ellipse at 12% 5%,rgba(45,123,238,.10),transparent 34%),
    radial-gradient(ellipse at 90% 85%,rgba(80,155,255,.10),transparent 32%),
    linear-gradient(145deg,#f9fbff 0%,#edf3fb 50%,#f7faff 100%);
  display:flex; align-items:center; justify-content:center; padding:28px 16px;
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;
  background-image:linear-gradient(rgba(28,75,140,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(28,75,140,.035) 1px,transparent 1px);
  background-size:46px 46px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
.shell{width:min(100%,1020px);position:relative;z-index:1}
.topline{display:flex;justify-content:space-between;align-items:center;margin:0 4px 18px;gap:12px}
.brand{display:flex;align-items:center;gap:11px;letter-spacing:.16em;text-transform:uppercase;font-size:11px;font-weight:750;color:#263b60}
.brand-flash{letter-spacing:0;text-transform:none;font-size:clamp(22px,4.6vw,36px);font-weight:900}
.team-heading{display:inline-block;line-height:1.2;background:none;background-clip:border-box;-webkit-background-clip:border-box;color:#1457b8;animation:none;text-shadow:none}
.team-name{white-space:nowrap}
@keyframes teamShimmer{to{background-position:250% center}}
@keyframes teamGlow{from{filter:drop-shadow(0 0 0 rgba(22,135,238,0))}to{filter:drop-shadow(0 0 7px rgba(22,135,238,.35))}}
@media(prefers-reduced-motion:reduce){.team-heading{animation:none;background-position:center}}

.brand-mark{width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:grid;place-items:center;overflow:hidden;background:#fff;border:1px solid rgba(3,192,11,.25)}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
.secure{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#65758e;display:flex;align-items:center;gap:7px}
.secure-dot{width:6px;height:6px;background:var(--good);border-radius:50%;box-shadow:0 0 10px rgba(139,216,165,.65)}
.card{display:grid;grid-template-columns:.82fr 1.18fr;overflow:hidden;border:1px solid rgba(27,93,174,.12);border-radius:26px;background:rgba(255,255,255,.88);box-shadow:0 24px 70px rgba(31,67,115,.12),inset 0 1px rgba(255,255,255,.85);backdrop-filter:blur(18px)}
.intro{padding:42px 34px;position:relative;overflow:hidden;background:linear-gradient(155deg,rgba(46,126,239,.10),rgba(255,255,255,.3) 55%),#f4f8ff;border-right:1px solid rgba(18,105,232,.12)}
.intro:after{content:"";position:absolute;width:260px;height:260px;border:1px solid rgba(18,105,232,.12);border-radius:50%;right:-130px;bottom:-100px;box-shadow:0 0 0 24px rgba(18,105,232,.025),0 0 0 52px rgba(18,105,232,.02)}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:var(--gold);font-weight:800;display:flex;align-items:center;gap:9px}
.eyebrow:before{content:"";width:23px;height:1px;background:var(--gold)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.045em;font-size:clamp(35px,4vw,52px);line-height:1.04;margin:24px 0 18px}
h1 span{color:var(--gold);font-style:italic}
.intro-copy{font-size:13px;line-height:1.8;color:#5d6d86;max-width:270px}
.rule{height:1px;background:linear-gradient(90deg,rgba(18,105,232,.38),transparent);margin:28px 0 22px}
.feature{display:flex;align-items:flex-start;gap:11px;margin:16px 0;position:relative;z-index:1}
.feature-icon{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border:1px solid rgba(18,105,232,.18);border-radius:9px;color:var(--gold);font-size:13px;background:rgba(18,105,232,.045)}
.feature strong{display:block;font-size:12px;font-weight:650;margin:1px 0 4px}
.feature small{display:block;color:#71809a;font-size:11px;line-height:1.5}
.form-area{padding:39px clamp(22px,4vw,48px) 30px}
.form-head{margin-bottom:27px}
.form-head h2{font-size:23px;letter-spacing:-.035em;margin:0 0 8px;font-weight:650}
.form-head p{font-size:12px;color:var(--muted);margin:0;line-height:1.6}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 15px}
.field{min-width:0}
.field.full{grid-column:1/-1}
label{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#253b5f;font-weight:650;margin:0 0 9px}
.optional{font-size:10px;color:#777b82;font-weight:500}
.control{position:relative}
input,select,textarea{width:100%;border:1px solid #d5e0ef;border-radius:12px;background:linear-gradient(180deg,#ffffff,#f9fbff);padding:14px 14px;color:#10203f;font:inherit;font-size:13px;outline:none;transition:border .2s,box-shadow .2s}
input::placeholder,textarea::placeholder{color:#8391a8}
input:focus,select:focus,textarea:focus{border-color:rgba(18,105,232,.62);box-shadow:0 0 0 3px rgba(18,105,232,.09)}
select{appearance:none;padding-right:38px;color:#e8e5dd}
.select-arrow{position:absolute;right:15px;top:50%;transform:translateY(-50%);pointer-events:none;color:#b8a06e;font-size:12px}
textarea{resize:vertical;min-height:82px}
.hint{font-size:10px;color:#777b82;margin-top:7px;line-height:1.45}
.submit{width:100%;margin-top:23px;border:0;border-radius:12px;padding:15px 18px;color:#ffffff;font-size:12px;font-weight:850;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;background:linear-gradient(105deg,#0867e9,#248bff 48%,#0759d5);color:#ffffff;box-shadow:0 8px 25px rgba(18,105,232,.22);transition:transform .18s,filter .18s}
.submit:hover{filter:brightness(1.07);transform:translateY(-1px)}
.submit:disabled{opacity:.65;cursor:wait;transform:none}
.privacy{display:flex;gap:9px;align-items:flex-start;margin-top:16px;color:#697b95;font-size:10px;line-height:1.65}
.privacy svg{flex:0 0 14px;margin-top:1px;color:var(--gold)}
.status{display:none;margin-top:15px;border-radius:10px;padding:12px 13px;font-size:12px;line-height:1.55}
.status.show{display:block}
.status.ok{border:1px solid rgba(139,216,165,.25);background:rgba(139,216,165,.07);color:#bce9c9}
.status.err{border:1px solid rgba(255,120,120,.25);background:rgba(255,120,120,.07);color:#ffc1c1}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:15px 5px 0;color:#7d8ba0;font-size:10px;line-height:1.6}
.foot strong{color:#526785;font-weight:600}

.video-hero{position:relative;width:100%;aspect-ratio:16/7;min-height:210px;max-height:410px;overflow:hidden;border-radius:22px;margin:0 0 18px;background:#071324;box-shadow:0 18px 45px rgba(18,54,100,.18);border:1px solid rgba(25,91,180,.18)}
.video-hero video{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#071324}
.video-caption{position:absolute;left:18px;bottom:15px;z-index:2;padding:8px 12px;border-radius:999px;background:rgba(7,17,35,.7);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:10px;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
.sound-hint{position:absolute;right:14px;bottom:14px;z-index:3;border:1px solid rgba(255,255,255,.28);border-radius:999px;background:rgba(5,16,34,.82);color:#fff;padding:10px 14px;font:600 11px system-ui;cursor:pointer;backdrop-filter:blur(10px)}
.video-fallback{position:absolute;top:14px;right:14px;z-index:3;text-decoration:none;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(5,16,34,.82);color:#fff;padding:9px 12px;font:600 10px system-ui}
@media(max-width:760px){.video-hero{aspect-ratio:16/9;min-height:180px;border-radius:17px;margin-bottom:13px}.video-caption{font-size:9px;left:11px;bottom:11px}.sound-hint{right:9px;bottom:9px;padding:9px 11px}.video-fallback{right:9px;top:9px;padding:8px 10px;font-size:9px}}

@media(max-width:760px){
 body{padding:17px 12px;align-items:flex-start}
 .topline{margin:0 2px 13px}
 .card{grid-template-columns:1fr;border-radius:21px}
 .intro{padding:25px 24px 23px;border-right:0;border-bottom:1px solid rgba(18,105,232,.12)}
 .intro:after{width:170px;height:170px;right:-80px;bottom:-90px}
 h1{font-size:36px;margin:15px 0 10px}
 .intro-copy{max-width:420px;font-size:12px}
 .rule{margin:17px 0 12px}
 .feature-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .feature{margin:4px 0}
 .feature-icon{width:27px;height:27px;flex-basis:27px}
 .form-area{padding:27px 22px 24px}
 .form-head{margin-bottom:22px}
}
@media(max-width:420px){
 .secure{font-size:9px;letter-spacing:.06em}
 .brand{font-size:10px;letter-spacing:.11em}
 .form-grid{grid-template-columns:1fr;gap:16px}
 .field.full{grid-column:auto}
 .feature-row{grid-template-columns:1fr}
 .intro{padding:23px 21px}
 .form-area{padding:25px 18px 22px}
}

/* Registration success celebration */
.celebration{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(7,19,42,.62);backdrop-filter:blur(7px);overflow:hidden}
.celebration.show{display:flex;animation:veilIn .25s ease-out}
.welcome-card{position:relative;z-index:2;width:min(100%,440px);padding:38px 26px 30px;border:1px solid rgba(255,255,255,.85);border-radius:26px;text-align:center;background:linear-gradient(145deg,#fff,#f0f7ff);box-shadow:0 25px 90px rgba(0,0,0,.25);animation:welcomePop .65s cubic-bezier(.2,1.4,.4,1) both}
.welcome-icon{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#0c72ed,#52b4ff);color:white;font-size:37px;box-shadow:0 10px 30px rgba(18,105,232,.3);animation:iconPulse 1.4s ease-in-out infinite}
.welcome-card h2{font-size:clamp(27px,6vw,36px);line-height:1.1;letter-spacing:-.04em;margin:0 0 12px;color:#10203f}
.welcome-card h2 span{display:block;color:#1269e8;margin-top:7px}
.welcome-card p{margin:0 auto 22px;max-width:330px;font-size:14px;line-height:1.7;color:#5c6e88}
.welcome-close{border:0;border-radius:12px;padding:13px 24px;background:linear-gradient(105deg,#0867e9,#248bff);color:#fff;font-weight:750;cursor:pointer;box-shadow:0 8px 22px rgba(18,105,232,.22)}
.confetti-piece{position:fixed;z-index:10000;top:-18px;width:9px;height:15px;pointer-events:none;animation:confettiFall var(--duration,2.8s) cubic-bezier(.15,.6,.3,1) forwards;transform:rotate(var(--rot,0deg));border-radius:2px}
@keyframes veilIn{from{opacity:0}to{opacity:1}}
@keyframes welcomePop{0%{transform:translateY(35px) scale(.65);opacity:0}75%{transform:translateY(-5px) scale(1.03);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes iconPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes confettiFall{0%{transform:translate3d(0,-5vh,0) rotate(0deg);opacity:1}100%{transform:translate3d(var(--drift,80px),110vh,0) rotate(780deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.welcome-card,.welcome-icon,.celebration.show{animation:none}.confetti-piece{display:none}}


/* Language selector and date field */
.topline{gap:12px;flex-wrap:wrap}
.top-actions{display:flex;align-items:center;gap:12px}
.lang-switch{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:#fff}
.lang-switch button{border:0;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:800;color:var(--muted);background:transparent;cursor:pointer}
.lang-switch button.active{background:#1269e8;color:#fff}
.brand-mark{display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.brand-mark img{width:100%;height:100%;object-fit:contain;padding:3px}
.brand-fallback{display:none;align-items:center;justify-content:center;width:100%;height:100%;font-weight:900;color:#00b909;font-size:21px;letter-spacing:-2px}
.video-hero{background:#071324}
.video-caption{pointer-events:none}
@media(max-width:520px){.top-actions{width:100%;justify-content:space-between}.secure{font-size:10px}}

/* ===== Engagement and conversion-friendly refinements ===== */
.shell{width:min(100%,1080px)}
.topline{margin-bottom:20px}
.brand.brand-flash{align-items:flex-start}
.team-heading{font-size:clamp(20px,3.2vw,30px);line-height:1.22}
.video-hero{transition:box-shadow .22s ease,transform .22s ease}
.video-hero:hover{box-shadow:0 24px 58px rgba(18,54,100,.22);transform:translateY(-1px)}
.card{transition:box-shadow .25s ease,border-color .25s ease}
.card:hover{border-color:rgba(27,93,174,.19);box-shadow:0 28px 78px rgba(31,67,115,.15),inset 0 1px rgba(255,255,255,.9)}
.intro{padding:42px 34px}
.intro-cta{
  display:inline-flex;align-items:center;gap:12px;margin-top:18px;padding:11px 15px;
  border-radius:11px;text-decoration:none;color:#fff;font-size:12px;font-weight:750;
  background:linear-gradient(105deg,#0867e9,#248bff);box-shadow:0 8px 18px rgba(18,105,232,.18);
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease
}
.intro-cta:hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 12px 24px rgba(18,105,232,.25)}
.intro-cta span:last-child{font-size:16px}
.how-card{
  margin-top:25px;padding:17px 17px 12px;border:1px solid rgba(18,105,232,.13);
  border-radius:15px;background:rgba(255,255,255,.63);position:relative;z-index:1
}
.how-title{font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.14em;color:#1769d2;margin-bottom:13px}
.how-step{display:flex;align-items:center;gap:11px;margin:11px 0;font-size:11px;font-weight:600;color:#405777}
.how-number{
  width:27px;height:27px;flex:0 0 27px;border-radius:9px;display:grid;place-items:center;
  color:#1769d2;background:#e9f2ff;border:1px solid #d7e7ff;font-size:9px;font-weight:850
}
.form-head{margin-bottom:19px}
.form-head h2{font-size:25px}
.form-progress{padding:14px 15px 13px;margin:0 0 23px;border:1px solid #dce8f7;border-radius:14px;background:linear-gradient(135deg,#f4f8ff,#fff)}
.progress-top{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#526785;font-size:11px;font-weight:700;margin-bottom:10px}
.progress-top strong{color:#1269e8;font-size:12px;font-variant-numeric:tabular-nums}
.progress-track{height:7px;width:100%;overflow:hidden;border-radius:999px;background:#e0eaf7}
.progress-fill{display:block;width:0;height:100%;border-radius:999px;background:linear-gradient(90deg,#1269e8,#43a2ff);transition:width .3s ease}
